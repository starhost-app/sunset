name: launcher

on:
  push:
    branches: [main]
    tags: ['v*', 'launcher-*', 'sunset-*']
    paths:
      - 'launcher/**'
      - 'crates/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave blank to use version from Cargo.toml, e.g. v1.0.8)'
        required: false
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          else
            CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)
            RAW_TAG="v${CARGO_VER}"
          fi

          VERSION="${RAW_TAG#v}"
          VERSION="${VERSION#launcher-v}"
          VERSION="${VERSION#launcher@}"
          VERSION="${VERSION#sunset-v}"
          VERSION="${VERSION#sunset-}"

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Determined Version: ${VERSION}, Tag: ${TAG}"

  build:
    needs: version
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            binary: sunset-launcher
            legacy_binary: horizon-launcher
            archive: sunset-launcher-linux-x86_64.tar.gz
            legacy_archive: horizon-launcher-linux-x86_64.tar.gz
            standalone: sunset-launcher-linux-x86_64
          - name: windows-x64
            os: windows-latest
            binary: sunset-launcher.exe
            legacy_binary: horizon-launcher.exe
            archive: sunset-launcher-windows-x64.zip
            legacy_archive: horizon-launcher-windows-x64.zip
            standalone: sunset-launcher-windows-x64.exe
            rustflags: -C target-feature=+crt-static
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-${{ matrix.name }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev

      - name: Build release binaries
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          HORIZON_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
          HORIZON_LAUNCHER_TAG: ${{ needs.version.outputs.tag }}
        run: |
          cargo build --release --locked

      - name: Package artifacts
        run: |
          mkdir -p dist out
          cp target/release/${{ matrix.binary }} dist/${{ matrix.binary }}
          if [ -f target/release/${{ matrix.legacy_binary }} ]; then
            cp target/release/${{ matrix.legacy_binary }} dist/${{ matrix.legacy_binary }}
          fi
          cp target/release/${{ matrix.binary }} out/${{ matrix.standalone }}

          if [[ "${{ matrix.archive }}" == *.tar.gz ]]; then
            (cd dist && tar -czf ../out/${{ matrix.archive }} *)
            cp out/${{ matrix.archive }} out/${{ matrix.legacy_archive }}
          else
            if command -v 7z &> /dev/null; then
              (cd dist && 7z a ../out/${{ matrix.archive }} *)
            else
              (cd dist && zip -r ../out/${{ matrix.archive }} *)
            fi
            cp out/${{ matrix.archive }} out/${{ matrix.legacy_archive }}
          fi
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.name }}
          path: launcher/out/*
          retention-days: 1

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          echo "### Release Checksums" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
          DRAFT: ${{ github.event.inputs.draft || 'false' }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets..."
            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creating new release $TAG..."
            FLAGS=()
            if [ "$PRERELEASE" = "true" ]; then
              FLAGS+=(--prerelease)
            fi
            if [ "$DRAFT" = "true" ]; then
              FLAGS+=(--draft)
            fi

            python3 -c "
            import os
            version = os.environ['VERSION']
            tag = os.environ['TAG']
            repo = os.environ['GITHUB_REPOSITORY']
            notes = f'''## SunSet Launcher v{version}

            ### Downloads
            - **Windows (x64)**:
              - Standalone EXE: [sunset-launcher-windows-x64.exe](https://github.com/{repo}/releases/download/{tag}/sunset-launcher-windows-x64.exe)
              - Zip Package: [sunset-launcher-windows-x64.zip](https://github.com/{repo}/releases/download/{tag}/sunset-launcher-windows-x64.zip)
            - **Linux (x86_64)**:
              - Standalone Binary: [sunset-launcher-linux-x86_64](https://github.com/{repo}/releases/download/{tag}/sunset-launcher-linux-x86_64)
              - Tarball: [sunset-launcher-linux-x86_64.tar.gz](https://github.com/{repo}/releases/download/{tag}/sunset-launcher-linux-x86_64.tar.gz)

            *Checksums are verified in SHA256SUMS.*'''
            with open('notes.md', 'w') as f:
                f.write(notes)
            "

            gh release create "$TAG" dist/* \
              --title "SunSet Launcher v${VERSION}" \
              --notes-file notes.md \
              "${FLAGS[@]}"
          fi
