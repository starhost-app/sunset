name: launcher

on:
  push:
    branches: [main]
    tags: ['v*', 'launcher-*', 'sunset-*']
    paths:
      - 'launcher/**'
      - 'crates/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave blank to use version from Cargo.toml, e.g. v1.0.10)'
        required: false
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          else
            CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)
            RAW_TAG="v${CARGO_VER}"
          fi

          VERSION="${RAW_TAG#v}"
          VERSION="${VERSION#launcher-v}"
          VERSION="${VERSION#launcher@}"
          VERSION="${VERSION#sunset-v}"
          VERSION="${VERSION#sunset-}"

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Determined Version: ${VERSION}, Tag: ${TAG}"

  build:
    needs: version
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            binary: sunset-launcher
            standalone: sunset-launcher-linux-x86_64
            game_bin: sunset-client
            prepare_bin: sunset-prepare
            dir_name: sunset-linux-x86_64
            game_asset: sunset-linux-x86_64.tar.gz
          - name: windows-x64
            os: windows-latest
            binary: sunset-launcher.exe
            standalone: sunset-launcher-windows-x64.exe
            game_bin: sunset-client.exe
            prepare_bin: sunset-prepare.exe
            dir_name: sunset-windows-x64
            game_asset: sunset-windows-x64.zip
            rustflags: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev

      - name: Build Launcher
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          HORIZON_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
          HORIZON_LAUNCHER_TAG: ${{ needs.version.outputs.tag }}
        run: |
          cargo build --release --locked --manifest-path launcher/Cargo.toml

      - name: Build Game Client & Tools
        run: |
          cargo build --release --locked -p sunset-client --bin sunset-client -p sunset-prepare --bin sunset-prepare

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p out
          # 1. Standalone launcher
          cp launcher/target/release/${{ matrix.binary }} out/${{ matrix.standalone }}

          # 2. Game client package
          mkdir -p game_dist/${{ matrix.dir_name }}
          cp target/release/${{ matrix.game_bin }} game_dist/${{ matrix.dir_name }}/
          cp target/release/${{ matrix.prepare_bin }} game_dist/${{ matrix.dir_name }}/
          cp research-lock.json game_dist/${{ matrix.dir_name }}/
          cp packaging/PLAY.txt game_dist/${{ matrix.dir_name }}/

          if [ "${{ runner.os }}" = "Windows" ]; then
            cd game_dist && 7z a -tzip ../out/${{ matrix.game_asset }} ${{ matrix.dir_name }}
          else
            cd game_dist && tar -czf ../out/${{ matrix.game_asset }} ${{ matrix.dir_name }}
          fi
          cd ..
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: out/*
          retention-days: 1

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          echo "### Release Checksums" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Notes and Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
          DRAFT: ${{ github.event.inputs.draft || 'false' }}
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match="v1*" HEAD^ 2>/dev/null || git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..HEAD" --format="- %s")
          else
            NOTES=$(git log -n 1 --format="- %s")
          fi
          if [ -z "$NOTES" ]; then
            NOTES=$(git log -n 1 --format="- %s")
          fi
          echo "$NOTES" > notes.md
          echo "### Generated Patch Notes:"
          cat notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets and notes..."
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creating new release $TAG..."
            FLAGS=()
            if [ "$PRERELEASE" = "true" ]; then
              FLAGS+=(--prerelease)
            fi
            if [ "$DRAFT" = "true" ]; then
              FLAGS+=(--draft)
            fi

            gh release create "$TAG" dist/* \
              --title "SunSet v${VERSION}" \
              --notes-file notes.md \
              "${FLAGS[@]}"
          fi
